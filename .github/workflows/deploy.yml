name: Deploy MR FOP FASHIONS to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "mrfob-production-pages-v2"
  cancel-in-progress: true

jobs:
  build:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java for Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install
      - name: Install CI test tools
        run: npm install --no-save @firebase/rules-unit-testing@4.0.1 firebase-tools playwright
      - name: Verify Google Drive integration configuration
        env:
          VITE_GOOGLE_DRIVE_CLIENT_ID: ${{ vars.VITE_GOOGLE_DRIVE_CLIENT_ID || secrets.VITE_GOOGLE_DRIVE_CLIENT_ID }}
          VITE_GOOGLE_DRIVE_FOLDER_ID: ${{ vars.VITE_GOOGLE_DRIVE_FOLDER_ID || secrets.VITE_GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          if [ -z "$VITE_GOOGLE_DRIVE_CLIENT_ID" ] || [ -z "$VITE_GOOGLE_DRIVE_FOLDER_ID" ]; then
            echo "::error::Google Drive client ID and shared folder ID must be configured as repository Variables or Secrets before deployment."
            exit 1
          fi
      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_GOOGLE_DRIVE_CLIENT_ID: ${{ vars.VITE_GOOGLE_DRIVE_CLIENT_ID || secrets.VITE_GOOGLE_DRIVE_CLIENT_ID }}
          VITE_GOOGLE_DRIVE_FOLDER_ID: ${{ vars.VITE_GOOGLE_DRIVE_FOLDER_ID || secrets.VITE_GOOGLE_DRIVE_FOLDER_ID }}
          VITE_ASSESSMENT_GRADING_URL: ${{ vars.VITE_ASSESSMENT_GRADING_URL || secrets.VITE_ASSESSMENT_GRADING_URL }}
        run: npm run build
      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium
      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/mrfop-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/mrfob/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mrfop-preview.log
          exit 1
      - name: Verify homepage, standalone routes and account portal in Chromium
        run: node scripts/smoke-test.mjs
      - name: Verify platform source guardrails
        run: npm run verify:platform
      - name: Verify Firestore rules in Emulator
        run: npx firebase emulators:exec --only firestore --project demo-mrfop-rules --non-interactive "node scripts/verify-firestore-rules.mjs"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
